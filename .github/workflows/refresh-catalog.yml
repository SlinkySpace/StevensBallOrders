name: Refresh catalog

# Re-scrapes stormbowling.com and pushes prices and stock into the database.
#
# Requires two repository secrets:
#   DATABASE_URL      - the same Neon connection string the app uses
#   STORM_AUTH_STATE  - the contents of storm_auth_state.json, i.e. a logged-in
#                       browser session for stormbowling.com
#
# STORM_AUTH_STATE expires. When it does the scrape still finishes, but as a
# logged-out visitor seeing retail prices instead of sponsor prices, so
# sync_catalog.py refuses to write and this workflow opens an issue. Refreshing
# the secret is a manual job - see the README.

# Run on demand, not on a schedule.
#
# Storm's session cookies are short-lived - one expires within the hour - so a
# weekly cron would reliably find the saved login stale, scrape the public
# retail prices instead of the team's, trip the guards and fail. A job that
# always fails is worse than no job.
#
# Instead: scripts/refresh-storm-login.ps1 signs you in, uploads the session and
# starts this workflow immediately, while the login is fresh. The Catalog
# Manager warns when the catalog is getting old, which is the nudge to do it.
#
# To go back to a schedule, uncomment below - the failure path already opens an
# issue explaining how to refresh the secret.
#   schedule:
#     - cron: '0 9 * * 1'
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the results to the database (leave off for a dry run)'
        type: boolean
        default: false
      mode:
        description: 'Merge mode'
        type: choice
        options: [replace, refresh, add_new]
        default: replace
      max_price_drift:
        description: 'Abort if more than this fraction of prices changed (0.25 = 25%)'
        type: string
        default: '0.25'

# Never let two scrapes overlap; they would fight over the same CSV and images.
concurrency:
  group: refresh-catalog
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright Pillow
          playwright install --with-deps chromium

      # Costs a couple of seconds and catches what py_compile cannot. A missing
      # `urlparse` import got through and only surfaced after the login and
      # browser install had already run, on a step that can take 40 minutes.
      - name: Check for undefined names
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes storm_scraper.py label_cleaning.py sync_catalog.py \
                             catalog.py db.py app.py catalog_admin.py auth.py \
                             config.py email_utils.py dedupe_products.py wipe_orders.py

      # Same reasoning as the check above, one level up: these cover the merge
      # modes and the guards that decide whether a scrape is allowed to touch
      # the catalog at all. Cheaper to find a break here than after the scrape
      # has run and the write is the next step. They use a throwaway SQLite
      # file and never reach the network or the hosted database.
      - name: Run the test suite
        run: python tests/run_all.py

      - name: Restore the Storm login session
        env:
          STORM_AUTH_STATE: ${{ secrets.STORM_AUTH_STATE }}
        run: |
          if [ -z "$STORM_AUTH_STATE" ]; then
            echo "::error::STORM_AUTH_STATE secret is not set. See the README for how to create it."
            exit 1
          fi
          printf '%s' "$STORM_AUTH_STATE" > storm_auth_state.json
          python -c "import json;json.load(open('storm_auth_state.json'));print('auth state parsed OK')"

      - name: Scrape stormbowling.com
        env:
          SCRAPER_USE_EDGE: 'false'   # runners have no Edge; use bundled Chromium
          SCRAPER_HEADLESS: 'true'
        run: python storm_scraper.py

      - name: Tag categories
        run: python label_cleaning.py

      # Runs before the image work so a bad scrape fails in ~1 minute instead of
      # after downloading hundreds of files.
      - name: Check the scrape looks sane
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python sync_catalog.py \
            --dry-run \
            --mode "${{ inputs.mode || 'replace' }}" \
            --max-price-drift "${{ inputs.max_price_drift || '0.25' }}"

      - name: Fetch and compress images for new products
        run: |
          python download_images.py
          python optimize_images.py --delete-originals

      - name: Sync prices and stock to the database
        # Both forms are checked deliberately. The UI checkbox sends a real
        # boolean but `gh workflow run -f apply=true` sends the string "true",
        # and GitHub compares mixed types by coercing to numbers - so a plain
        # `inputs.apply == true` silently fails for CLI runs. Phrased as
        # opt-in, the worst case is a run that declines to write; the earlier
        # `dry_run != true` phrasing failed the other way and wrote during what
        # was meant to be a dry run.
        if: ${{ inputs.apply == true || inputs.apply == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SYNC_ACTOR: 'scheduled refresh'
        run: |
          python sync_catalog.py \
            --mode "${{ inputs.mode || 'replace' }}" \
            --max-price-drift "${{ inputs.max_price_drift || '0.25' }}"

      - name: Commit the refreshed catalog
        # Both forms are checked deliberately. The UI checkbox sends a real
        # boolean but `gh workflow run -f apply=true` sends the string "true",
        # and GitHub compares mixed types by coercing to numbers - so a plain
        # `inputs.apply == true` silently fails for CLI runs. Phrased as
        # opt-in, the worst case is a run that declines to write; the earlier
        # `dry_run != true` phrasing failed the other way and wrote during what
        # was meant to be a dry run.
        if: ${{ inputs.apply == true || inputs.apply == 'true' }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add storm_products_tagged.csv static/catalog_images
          if git diff --cached --quiet; then
            echo "Nothing changed in the catalog files."
          else
            git commit -m "Refresh catalog from stormbowling.com

          Automated weekly scrape. Prices and stock are already live in the
          database; this commit carries the CSV of record and any images for
          products that are new since the last run."
            git push
          fi

      # Keeps the scraper output around even when a run fails, so a bad scrape
      # can be inspected without re-running it.
      - name: Keep the scraped CSVs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scrape-output
          path: |
            storm_products.csv
            storm_products_tagged.csv
          retention-days: 14
          if-no-files-found: warn

      - name: Open an issue if this failed
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE='Scheduled catalog refresh failed'
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: $RUN_URL"
            exit 0
          fi

          gh issue create --title "$TITLE" --body "$(cat <<EOF
          The weekly catalog refresh failed: $RUN_URL

          The usual cause is an expired \`STORM_AUTH_STATE\`. When the saved session
          stops working the scraper sees stormbowling.com logged out, which means
          retail prices rather than sponsor prices, and \`sync_catalog.py\` refuses
          to write them to the database.

          Nothing was written, so the catalog in the app is unchanged and still
          usable. To fix:

          1. Locally, set \`SCRAPER_SETUP_LOGIN=true\` and run \`python storm_scraper.py\`.
          2. Log in to stormbowling.com in the browser window that opens, then press Enter.
          3. Copy the contents of the regenerated \`storm_auth_state.json\`.
          4. Paste it into the \`STORM_AUTH_STATE\` repository secret.
          5. Re-run this workflow from the Actions tab.

          Check the "scrape-output" artifact on the failed run to see what was
          actually scraped.
          EOF
          )"
